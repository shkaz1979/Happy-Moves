<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 Executive Transfer | توصيل مطار الكويت</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --dark: #090d16;
      --dark-card: #131b2e;
      --primary: #008751;
      --primary-hover: #006b40;
      --accent: #d4af37;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 50px;
    }

    /* HERO HEADER */
    .hero {
      background: linear-gradient(135deg, #090d16 0%, #162238 100%);
      color: #fff;
      padding: 22px 20px 85px;
      text-align: center;
    }

    .nav {
      max-width: 540px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span { color: var(--accent); }

    .lang-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }

    .lang-btn:hover { background: rgba(255, 255, 255, 0.22); }

    .hero h1 {
      font-size: 26px;
      font-weight: 800;
      max-width: 480px;
      margin: 0 auto 8px;
    }

    .hero p {
      color: #94a3b8;
      font-size: 14px;
      max-width: 420px;
      margin: 0 auto;
    }

    /* MAIN BOOKING CARD */
    .container {
      max-width: 540px;
      margin: -55px auto 0;
      padding: 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(255,255,255,0.8);
    }

    /* SEGMENTED TABS */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 11px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* VEHICLE CARDS */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .vehicles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .v-card {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: #fff;
    }

    .v-card:hover { border-color: #cbd5e1; }

    .v-card.selected {
      border-color: var(--primary);
      background: #f0fdf4;
    }

    .v-icon { font-size: 24px; margin-bottom: 4px; }
    .v-name { font-size: 13px; font-weight: 800; color: var(--text); }
    .v-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ROUTE INPUTS + SWAP */
    .route-box {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      display: block;
      color: var(--text);
    }

    select, input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      background: #f8fafc;
      transition: 0.2s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 135, 81, 0.12);
    }

    .swap-row {
      display: flex;
      justify-content: center;
      margin: -6px 0;
      z-index: 2;
    }

    .swap-btn {
      background: #fff;
      border: 1.5px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .swap-btn:hover { background: #f8fafc; transform: rotate(180deg); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    @media (max-width: 460px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* BUTTONS */
    .calc-btn {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s;
    }

    .calc-btn:hover { background: #1e293b; }

    /* FARE TICKET SUMMARY */
    #summary {
      display: none;
      margin-top: 18px;
      background: linear-gradient(135deg, #090d16 0%, #162238 100%);
      color: #fff;
      border-radius: 16px;
      padding: 18px;
    }

    .fare-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .fare-price {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
    }

    .fare-sub { font-size: 12px; color: #94a3b8; }

    .whatsapp-btn {
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .whatsapp-btn:hover { background: #1fb858; }

    /* TRUST FEATURES */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
      text-align: center;
    }

    .feat {
      background: #fff;
      padding: 14px 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .feat-icon { font-size: 20px; margin-bottom: 4px; }
    .feat-title { font-size: 12px; font-weight: 700; color: var(--text); }
  </style>
</head>
<body>

  <header class="hero">
    <div class="nav">
      <div class="brand">🚘 <span>Q8</span> TRANSFER</div>
      <button type="button" class="lang-btn" onclick="toggleLang()" id="langBtn">عربي</button>
    </div>
    <h1 id="t-hero-title">Airport & City Rides Across Kuwait</h1>
    <p id="t-hero-sub">Instant distance pricing • 24/7 Chauffeur • Pay Cash or KNET on arrival</p>
  </header>

  <main class="container">
    <div class="card">
      <!-- SERVICE TABS -->
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-airport" onclick="setTab('airport')">✈️ Airport Transfer</button>
        <button type="button" class="tab-btn" id="tab-city" onclick="setTab('city')">🏙️ City Pick & Drop</button>
      </div>

      <!-- VEHICLE SELECTION CARDS -->
      <span class="section-label" id="t-vehicle">1. Select Vehicle</span>
      <div class="vehicles" id="vehicleCards"></div>

      <!-- ROUTE SELECTION -->
      <span class="section-label" id="t-route">2. Select Route</span>
      <div class="route-box">
        <div class="field">
          <label id="t-pickup">Pickup Area</label>
          <select id="pickup" onchange="checkAirportField()"></select>
        </div>

        <div class="swap-row">
          <button type="button" class="swap-btn" onclick="swapAreas()" title="Swap locations">⇅</button>
        </div>

        <div class="field">
          <label id="t-dropoff">Drop-off Area</label>
          <select id="dropoff" onchange="checkAirportField()"></select>
        </div>
      </div>

      <!-- FLIGHT NUMBER (AUTO SHOW/HIDE) -->
      <div class="field" id="flight-box" style="margin-bottom: 12px;">
        <label id="t-flight">Flight Number (Optional)</label>
        <input type="text" id="flight" placeholder="e.g., KU 102 / J9 415">
      </div>

      <!-- DATE & PHONE -->
      <div class="grid-2">
        <div class="field">
          <label id="t-time">Date & Time</label>
          <input type="datetime-local" id="dateTime" required>
        </div>
        <div class="field">
          <label id="t-phone">Mobile Number</label>
          <input type="tel" id="phone" placeholder="99001122" required>
        </div>
      </div>

      <button type="button" class="calc-btn" onclick="calculateFare()" id="t-calc">Calculate Fare</button>

      <!-- RESULT TICKET -->
      <div id="summary">
        <div class="fare-header">
          <div>
            <div class="fare-sub" id="t-est">Estimated Total</div>
            <div class="fare-price" id="fareDisplay">0.000 KWD</div>
          </div>
          <div style="text-align: end;">
            <div class="fare-sub" id="distDisplay">0 km</div>
