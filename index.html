<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 Executive Transfer | توصيل مطار الكويت</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --dark: #090d16;
      --primary: #008751;
      --accent: #d4af37;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 50px;
    }

    .hero {
      background: linear-gradient(135deg, #090d16 0%, #162238 100%);
      color: #fff;
      padding: 22px 20px 85px;
      text-align: center;
    }

    .nav {
      max-width: 540px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span { color: var(--accent); }

    .lang-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .hero h1 { font-size: 25px; font-weight: 800; max-width: 480px; margin: 0 auto 8px; }
    .hero p { color: #94a3b8; font-size: 14px; max-width: 420px; margin: 0 auto; }

    .container { max-width: 540px; margin: -55px auto 0; padding: 0 16px; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 11px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .vehicles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .v-card {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      background: #fff;
    }

    .v-card.selected { border-color: var(--primary); background: #f0fdf4; }
    .v-icon { font-size: 24px; margin-bottom: 4px; }
    .v-name { font-size: 13px; font-weight: 800; color: var(--text); }
    .v-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .route-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .field label { font-size: 13px; font-weight: 700; margin-bottom: 5px; display: block; color: var(--text); }

    select, input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: #0f172a;
      background-color: #f8fafc;
    }

    select option { color: #0f172a; background: #ffffff; font-weight: 600; }
    select option:disabled { color: #008751; background: #f1f5f9; font-weight: 800; }

    select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .swap-row { display: flex; justify-content: center; margin: -4px 0; z-index: 2; }
    .swap-btn {
      background: #fff;
      border: 1.5px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    @media (max-width: 460px) { .grid-2 { grid-template-columns: 1fr; } }

    .calc-btn {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    #summary {
      display: none;
      margin-top: 18px;
      background: linear-gradient(135deg, #090d16 0%, #162238 100%);
      color: #fff;
      border-radius: 16px;
      padding: 18px;
    }

    .fare-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .fare-price { font-size: 26px; font-weight: 800; color: var(--accent); }
    .fare-sub { font-size: 12px; color: #94a3b8; }

    .whatsapp-btn {
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
      text-align: center;
    }

    .feat { background: #fff; padding: 14px 8px; border-radius: 14px; border: 1px solid var(--border); }
    .feat-icon { font-size: 20px; margin-bottom: 4px; }
    .feat-title { font-size: 12px; font-weight: 700; color: var(--text); }
  </style>
</head>
<body>

  <header class="hero">
    <div class="nav">
      <div class="brand">🚘 <span>Q8</span> TRANSFER</div>
      <button type="button" class="lang-btn" onclick="toggleLang()" id="langBtn">عربي</button>
    </div>
    <h1 id="t-hero-title">Airport & City Rides Across Kuwait</h1>
    <p id="t-hero-sub">Instant distance pricing • 24/7 Chauffeur • Pay Cash or KNET on arrival</p>
  </header>

  <main class="container">
    <div class="card">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-airport" onclick="setTab('airport')">✈️ Airport Transfer</button>
        <button type="button" class="tab-btn" id="tab-city" onclick="setTab('city')">🏙️ City Pick & Drop</button>
      </div>

      <span class="section-label" id="t-vehicle">1. Select Vehicle</span>
      <div class="vehicles" id="vehicleCards"></div>

      <span class="section-label" id="t-route">2. Select Route</span>
      <div class="route-box">
        <div class="field">
          <label id="t-pickup">Pickup Area</label>
          <select id="pickup" onchange="checkAirportField()"></select>
        </div>

        <div class="swap-row">
          <button type="button" class="swap-btn" onclick="swapAreas()" title="Swap locations">⇅</button>
        </div>

        <div class="field">
          <label id="t-dropoff">Drop-off Area</label>
          <select id="dropoff" onchange="checkAirportField()"></select>
        </div>
      </div>

      <div class="field" id="flight-box" style="margin-bottom: 12px;">
        <label id="t-flight">Flight Number (Optional)</label>
        <input type="text" id="flight" placeholder="e.g., KU 102 / J9 415">
      </div>

      <div class="grid-2">
        <div class="field">
          <label id="t-time">Date & Time</label>
          <input type="datetime-local" id="dateTime" required>
        </div>
        <div class="field">
          <label id="t-phone">Mobile Number</label>
          <input type="tel" id="phone" placeholder="99001122" required>
        </div>
      </div>

      <button type="button" class="calc-btn" onclick="calculateFare()" id="t-calc">Calculate Fare</button>

      <div id="summary">
        <div class="fare-header">
          <div>
            <div class="fare-sub" id="t-est">Estimated Total</div>
            <div class="fare-price" id="fareDisplay">0.000 KWD</div>
          </div>
          <div style="text-align: end;">
            <div class="fare-sub" id="distDisplay">0 km</div>
            <div class="fare-sub" id="t-pay">Cash / KNET</div>
          </div>
        </div>
        <button type="button" class="whatsapp-btn" onclick="bookWhatsApp()" id="t-wa">Book Now on WhatsApp</button>
      </div>
    </div>

    <div class="features">
      <div class="feat">
        <div class="feat-icon">⏱️</div>
        <div class="feat-title" id="f-1">24/7 On-Time</div>
      </div>
      <div class="feat">
        <div class="feat-icon">💳</div>
        <div class="feat-title" id="f-2">Cash or KNET</div>
      </div>
      <div class="feat">
        <div class="feat-icon">✈️</div>
        <div class="feat-title" id="f-3">Flight Tracking</div>
      </div>
    </div>
  </main>

  <script>
    // 1. WHATSAPP & AIRPORT FEE SETTINGS
    const WHATSAPP_NUMBER = "96599999999"; // Replace with your Kuwait WhatsApp number
    const AIRPORT_FEE = 1.500;             // Extra KWD fee for Airport trips

    // 2. VEHICLES & RATES (IN KWD)
    const vehicles = [
      { id: "sedan", icon: "🚗", en: "Sedan", ar: "صالون", metaEn: "4 Pax • 2 Bags", metaAr: "4 ركاب • 2 شنط", base: 1.500, perKm: 0.250 },
      { id: "suv", icon: "🚙", en: "Family SUV", ar: "جيب عائلي", metaEn: "6 Pax • 4 Bags", metaAr: "6 ركاب • 4 شنط", base: 2.500, perKm: 0.350 },
