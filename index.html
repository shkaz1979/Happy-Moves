<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY MOVE Co Limousine & Airport Service</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --dark: #090d16;
      --dark-2: #111827;
      --primary: #008751;
      --accent: #d4af37;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* TOP NAVBAR */
    .navbar {
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span { color: var(--accent); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-links a:hover { color: #fff; }

    @media (max-width: 768px) {
      .nav-links a { display: none; }
      .brand { font-size: 15px; }
    }

    .lang-btn {
      background: var(--accent);
      color: #090d16;
      border: none;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }

    /* HERO SECTION */
    .hero {
      background: linear-gradient(135deg, #090d16 0%, #162238 100%);
      color: #fff;
      padding: 50px 20px 70px;
    }

    .hero-grid {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      color: var(--accent);
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .hero-text h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 16px;
      color: #fff;
    }

    .hero-text h1 span {
      color: var(--accent);
      display: block;
      font-size: 26px;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .hero-text h1 { font-size: 28px; }
      .hero-text h1 span { font-size: 20px; }
    }

    .hero-text p {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 26px;
      max-width: 500px;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 22px;
    }

    .stat h3 { font-size: 22px; color: var(--accent); font-weight: 800; }
    .stat span { font-size: 13px; color: #94a3b8; }

    /* BOOKING WIDGET CARD */
    .booking-card {
      background: #fff;
      color: var(--text);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .vehicles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .v-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
    }

    .v-card.selected { border-color: var(--primary); background: #f0fdf4; }
    .v-icon { font-size: 22px; }
    .v-name { font-size: 13px; font-weight: 800; }
    .v-meta { font-size: 11px; color: var(--muted); }

    .field { margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 700; margin-bottom: 4px; display: block; color: var(--text); }

    select, input {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
    }

    select option { color: #0f172a; background: #fff; }
    select option:disabled { color: #008751; background: #f1f5f9; font-weight: 800; }

    .swap-row { display: flex; justify-content: center; margin: -6px 0 4px; }
    .swap-btn {
      background: #fff;
      border: 1.5px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .calc-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }

    #summary {
      display: none;
      margin-top: 14px;
      background: var(--dark);
      color: #fff;
      border-radius: 14px;
      padding: 15px;
    }

    .fare-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .fare-price { font-size: 24px; font-weight: 800; color: var(--accent); }
    .fare-sub { font-size: 12px; color: #94a3b8; }

    .whatsapp-btn {
      width: 100%;
      padding: 12px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }

    /* WEBSITE CONTENT SECTIONS */
    .section {
      max-width: 1140px;
      margin: 0 auto;
      padding: 65px 20px;
    }

    .section-head {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .section-head h2 { font-size: 30px; font-weight: 800; margin-bottom: 8px; }
    .section-head p { color: var(--muted); font-size: 15px; }

    .cards-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    @media (max-width: 800px) { .cards-3 { grid-template-columns: 1fr; } }

    .info-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 4px 20px rgba(15,23,42,0.03);
    }

    .info-card .big-icon { font-size: 36px; margin-bottom: 12px; }
    .info-card h3 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
    .info-card p { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .price-tag {
      display: inline-block;
      background: #f0fdf4;
      color: var(--primary);
      font-weight: 800;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 8px;
    }

    /* POPULAR ROUTES */
    .routes-bg { background: #fff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .route-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .route-item:hover { border-color: var(--primary); transform: translateY(-2px); }
    .route-item h4 { font-size: 15px; font-weight: 800; }
    .route-item span { font-size: 13px; color: var(--muted); }
    .route-cta { font-size: 13px; font-weight: 800; color: var(--primary); }

    /* FOOTER */
    footer {
      background: var(--dark);
      color: #94a3b8;
      padding: 45px 20px;
      text-align: center;
      font-size: 14px;
    }

    footer h3 { color: #fff; font-size: 20px; margin-bottom: 8px; }
    footer p { max-width: 480px; margin: 0 auto 18px; }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="#" class="brand">🚘 <span>HAPPY MOVE Co</span> Limousine & Airport Service</a>
      <div class="nav-links">
        <a href="#fleet" id="nav-fleet">Our Fleet</a>
        <a href="#routes" id="nav-routes">Popular Routes</a>
        <a href="#how" id="nav-how">How It Works</a>
        <button type="button" class="lang-btn" onclick="toggleLang()" id="langBtn">عربي</button>
      </div>
    </div>
  </nav>

  <!-- HERO + BOOKING WIDGET -->
  <section class="hero" id="book">
    <div class="hero-grid">
      <div class="hero-text">
        <span class="badge" id="t-badge">🇰🇼 24/7 Chauffeur & Airport Transfer in Kuwait</span>
        <h1 id="t-hero-title">HAPPY MOVE Co <span>Limousine & Airport Service</span></h1>
        <p id="t-hero-sub">Instant KWD fare calculator for 24/7 airport and city transfers across Kuwait. Pay Cash or KNET on arrival.</p>
